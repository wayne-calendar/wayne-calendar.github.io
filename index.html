<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的行事曆</title>
<style>
:root{
  --ink:#16202c;--mute:#6b7785;--line:#dde2e8;--line2:#eef0f3;--bg:#e9edf1;--panel:#fff;--acc:#0f766e;--accbg:#d9f0ed;
  --c-urgent:#d6455d;--c-urgent-bg:#fde7eb;
  --c-important:#e08a1e;--c-important-bg:#fff0d9;
  --c-fixed:#7a8794;--c-fixed-bg:#e8ecf0;
  --c-routine:#3b7fc4;--c-routine-bg:#e1eefb;
  --gw:62px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;height:100dvh;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;line-height:1.2;white-space:nowrap}
.btn:hover{background:#f3f5f7}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#0c5f58}
.btn.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.btn.ico{width:34px;padding:6px 0;text-align:center}
.btn.danger{color:#b4233a;border-color:#efc3cb}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:6px 10px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:#fff}
#range{font-weight:700;font-size:16px;margin:0 4px;min-width:0}
#mact{display:none;gap:4px;align-items:center;order:10}
#range small{font-weight:500;color:var(--mute);font-size:12px;margin-left:6px}
.sp{flex:1}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--c-urgent);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px}
.main{flex:1;display:flex;min-height:0;position:relative}
#side .ms{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;margin-bottom:4px;background:var(--cbg);font-size:12px;cursor:pointer;white-space:nowrap}
.ms .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ms .d{color:var(--mute);font-size:11px;flex:none}
.ms .cd{padding:0 6px;font-size:11px;flex:none}
.tg{cursor:pointer;user-select:none}
.tg .ar{display:inline-block;width:14px;color:var(--mute)}
.dgh{cursor:grab;color:var(--mute);padding:0 2px;touch-action:none;user-select:none;-webkit-user-select:none;font-size:18px;line-height:1;flex:none}
.fr.dragging{opacity:.7;background:#eef3f7;border-radius:8px;box-shadow:0 4px 14px rgba(20,30,50,.18)}
#rside{display:none;width:var(--rw,236px);flex:none;background:var(--panel);overflow:auto;padding:12px;scrollbar-width:none}
#rside::-webkit-scrollbar{display:none}
#rail{display:none;width:46px;flex:none;background:var(--panel);border-right:3px solid #d5dae0;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
.rb{position:relative;width:36px;height:36px;border:0;background:transparent;border-radius:9px;cursor:pointer;color:#5a6672;padding:0}
.rb:hover{background:#e8eef0;color:var(--pri,#0f766e)}
.rb svg{display:block;margin:auto;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rb .n{position:absolute;top:1px;right:0;min-width:16px;height:16px;border-radius:8px;background:#d64b4b;color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 3px;font-weight:700}
.rb .n.g{background:#8a96a3}
.rb.ex{margin-bottom:6px;color:var(--pri,#0f766e)}
#rail{padding-top:12px}
.sidetop{margin:-2px 0 6px}
.sidecol{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--mute);border-radius:8px;padding:4px 8px 4px 4px;font-size:12px;cursor:pointer}
.sidecol:hover{background:#e8eef0;color:var(--pri,#0f766e)}
.sidecol svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:900px){#btnSide{display:none}}
@media (max-width:899px){.sidetop{display:none}}
.lbM{display:none}
@media (min-width:900px){body.sidec #side{display:none}body.sidec #rail{display:flex}}
#rwh{display:none;width:8px;margin:0 -4px;flex:none;cursor:col-resize;z-index:8;touch-action:none;position:relative}
@media (min-width:1500px){#rside{display:block}#rwh{display:block}.pk-l{display:none}}
#rwh:hover,#rwh.on{background:rgba(15,118,110,.18)}
body.rhide #rside,body.rhide #rwh{display:none!important}
body.rhide .pk-l{display:block!important}
body.cwfix #rside{flex:1;width:auto;min-width:236px}
body.cwfix #rwh{display:none!important}
.pkp{display:flex;gap:6px;font-size:12px;padding:2px 0;border-top:1px solid rgba(255,255,255,.7)}
.pkp .d{width:84px;flex:none;white-space:nowrap}
.pkp .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkp.past{color:var(--mute);text-decoration:line-through}
.pkp .cd{flex:none;font-size:11px;padding:0 6px;line-height:16px}
#side{width:272px;flex:none;background:var(--panel);border-right:3px solid #d5dae0;overflow:auto;padding:12px;scrollbar-width:thin}
#cal{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
.hd{display:grid;grid-template-columns:var(--gw) 1fr;border-bottom:1px solid var(--line);background:#fff;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.dhs,.cols,.ads{display:grid}
.dh{display:flex;align-items:center;justify-content:center;gap:5px;padding:3px 0;border-left:1px solid var(--line);color:var(--mute);font-size:13px;height:30px}
.dh .d{font-size:16px;font-weight:700;color:var(--ink);min-width:24px;text-align:center;line-height:24px}
.dh.tod{color:#fff;background:var(--acc)}
.dh.tod .d{color:#fff}
.dh.we{color:#a06a2c}
.dh.tod.we{color:#fff}
.adrow{display:grid;grid-template-columns:var(--gw) 1fr;border-bottom:1px solid var(--line);min-height:22px}
.adrow .gl{font-size:10px;color:var(--mute);padding:4px 6px 0 0;text-align:right}
.ad{border-left:1px solid var(--line);padding:2px 2px;display:flex;flex-direction:column;gap:2px;min-width:0}
.chip{background:var(--cbg);border-radius:5px;padding:1px 6px;font-size:var(--evfs,12px);white-space:normal;word-break:break-all;overflow:hidden;cursor:pointer}
#scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;touch-action:pan-y;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
#scroller::-webkit-scrollbar{display:none}
#grid{display:grid;grid-template-columns:var(--gw) 1fr}
.gut{position:relative}
.gut .hl{position:absolute;right:6px;font-size:13px;font-weight:700;color:#4a5562;transform:translateY(-50%);line-height:1}
.gut .per{position:absolute;left:0;width:18px;writing-mode:vertical-rl;text-align:center;font-size:11px;letter-spacing:3px;color:#5b6672;background:#f1f3f6;border-bottom:2px solid #5b6672;display:flex;align-items:center;justify-content:center}
.gut .per:nth-of-type(1){background:#fdf6e3}.gut .per:nth-of-type(2){background:#e9f1fb}.gut .per:nth-of-type(3){background:#ece8f6}
.sep{position:absolute;left:0;right:0;height:0;border-top:1px solid #9aa1a9;z-index:1;pointer-events:none}
.gut .sep{left:18px}
#grid{margin-top:9px}
.col{position:relative;border-left:1px solid var(--line)}
.hls{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:0}
.hls.hlt{z-index:3}
.hls.hlt .hln{background-color:transparent;background-image:linear-gradient(90deg,#8d96a3 0,#8d96a3 7px,transparent 7px,transparent calc(100% - 7px),#8d96a3 calc(100% - 7px),#8d96a3 100%);background-repeat:repeat-x}
.hln{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.hln.hf{background:var(--line2)}
.col.we{background-color:#fafbfc}
.brk{position:absolute;left:0;right:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(135deg,#f6efe3 0 8px,#efe5d3 8px 16px);color:var(--mute);font-size:12px;display:flex;align-items:center;justify-content:center}
.brk.blab{background:none;z-index:1}
.brk:not(.blab) span{visibility:hidden}
.brk span{background:rgba(255,255,255,.75);padding:2px 10px;border-radius:10px;white-space:nowrap}
.col.tod{background-color:#e2f5ea}
.now{position:absolute;left:0;right:0;height:2px;background:#e11d48;z-index:4;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:4px;background:#e11d48}
#sleep{margin-left:0;padding-left:var(--gw);box-sizing:border-box;height:44px;border-top:2px solid #5b6672;background:repeating-linear-gradient(135deg,#eef1f5 0 8px,#e6eaf0 8px 16px);color:var(--mute);font-size:12px;display:flex;align-items:center;justify-content:center;position:relative}
#sleep span{background:rgba(255,255,255,.75);padding:2px 10px;border-radius:10px}
.dseg{display:inline-flex;margin-bottom:10px}
.tpb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:#fff}
.tpb input,.tpb select{min-width:0}
.tph{cursor:grab;color:var(--mute);font-size:16px;padding:0 4px;touch-action:none;user-select:none}
.tpb.drag{opacity:.5}
.tpb.dropb{box-shadow:0 -3px 0 var(--acc)}
.tpb.dropa{box-shadow:0 3px 0 var(--acc)}
.tpl{display:flex;align-items:center;gap:6px;justify-content:center;height:26px;font-size:12px;color:var(--mute)}
.tpl .lkb{border:0;background:none;font-size:15px;cursor:pointer;padding:0 6px;opacity:.55}
.tpl.on .lkb{opacity:1}
.tpl.on{color:var(--acc)}
#robar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 12px;background:#fff4cc;border-bottom:1px solid #e6d28a;color:#6b5400;font-size:13px}
#robar[hidden]{display:none}
#robar span{flex:1;min-width:200px}
#robar .btn{padding:3px 10px;font-size:12px}
body.ro #btnNew,body.ro #btnBatch,body.ro #btnFrame,body.ro [data-newpack]{opacity:.4}
body.ro #ppl input,body.ro #ppl select,body.ro #ppl textarea{pointer-events:none;opacity:.7}
#sleep .tr{display:none}
#sleep.dg::after{content:"🗑";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.55}
#sleep.trash{background:repeating-linear-gradient(135deg,#fde4e4 0 8px,#f9d0d0 8px 16px)}
#sleep.trash span:not(.tr):not(.t1){display:none}
#sleep.trash .tr{display:inline-block;color:#b3261e;font-weight:700}
#sleep.trash::after{opacity:1;font-size:20px}
#sleep .t1{position:absolute;left:0;top:6px;font-size:13px;font-weight:700;color:#4a5562;background:transparent;padding:0;width:calc(var(--gw) - 6px);text-align:right;line-height:1}
.qblock{position:absolute;left:1px;right:2px;z-index:7;border-radius:6px;border-left:4px solid var(--c);background:var(--cbg);box-shadow:0 4px 14px rgba(20,30,50,.3);padding:2px 4px}
.qblock input,.qblock textarea{resize:none;line-height:1.25;width:100%;height:100%;min-height:18px;border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;outline:none;padding:0 2px}
#qbar{position:fixed;z-index:40;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(10,20,40,.3);padding:8px;display:flex;flex-direction:column;gap:6px}
#qbar .row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
#qbar .opt{padding:3px 8px}
#qbar .opt.on{background:var(--cbg);font-weight:700}
.ev{position:absolute;border-radius:6px;padding:2px 6px;font-size:var(--evfs,12px);line-height:1.25;overflow:hidden;background:var(--cbg);touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;z-index:2;box-shadow:0 0 0 1px rgba(255,255,255,.9)}
.ev .ic{position:absolute;top:3px;right:4px;line-height:0;color:#3d4753;opacity:.75;pointer-events:none}
.ev.hasic .ti{padding-right:16px}
.optic svg{vertical-align:-2px;margin-right:3px}
.ev .ti{font-weight:600;white-space:pre-line;word-break:break-all;overflow:hidden}
.ev .tm{color:var(--mute);font-size:calc(var(--evfs,12px) - 1px);white-space:normal}
.ev .tt{white-space:nowrap}
.ev.sm{display:flex;gap:6px;align-items:center;padding-top:0;padding-bottom:0;white-space:nowrap}
.ev.sm .ti{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.sm .tm{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev:not(.lift):hover{cursor:grab}
.ev.lift{box-shadow:0 8px 22px rgba(20,30,50,.28);z-index:6;cursor:grabbing}
.ev.ghost{background:var(--accbg);border-left-color:var(--acc);opacity:.9;pointer-events:none}
.rz{position:absolute;left:0;right:0;height:10px;cursor:ns-resize;touch-action:none;z-index:3}
.rz.rt{top:0}.rz.rb{bottom:0}
.ev.sm .rz.rb{height:6px}
.rz.rb{height:12px;width:auto;border-radius:0;background:transparent;border:0}
.rz.rb:hover{background:transparent}
.rz.rb::after{content:"";position:absolute;left:6px;right:6px;bottom:3px;height:4px;border-radius:2px;background:var(--c);filter:brightness(.7);opacity:0}
.ev:hover .rz.rb::after,.ev.lift .rz.rb::after{opacity:.55}
@media (pointer:coarse){.rz.rb::after{opacity:.45}}
.cat-urgent{--c:var(--c-urgent);--cbg:var(--c-urgent-bg)}
.cat-important{--c:var(--c-important);--cbg:var(--c-important-bg)}
.cat-fixed{--c:var(--c-fixed);--cbg:var(--c-fixed-bg)}
.cat-routine{--c:var(--c-routine);--cbg:var(--c-routine-bg)}
/* side */
.sec{margin-bottom:16px}
.sec h3{margin:0 0 6px;font-size:13px;display:flex;align-items:center;justify-content:space-between}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;font-weight:600}
.mh button{border:0;background:none;width:28px;height:28px;border-radius:14px}
.mh button:hover{background:#eef1f4}
.mg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px}
.mg .w{color:var(--mute);padding:2px 0;font-size:11px}
.mg .c{position:relative;height:30px;line-height:30px;cursor:pointer;border-radius:15px}
.mg .c:hover{background:#eef1f4}
.mg .c.o{color:#b3bcc6}
.mg .c.v{background:var(--accbg)}
.mg .c.t{font-weight:700;color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.mg .c i{position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--mute)}
.rem{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--cbg);border-radius:8px;margin-bottom:6px;cursor:pointer}
.rem .tx{flex:1;min-width:0}
.rem .ti{font-weight:600;word-break:break-all;white-space:pre-line}
.rem .dt{font-size:11px;color:var(--mute)}
.cd{display:inline-block;font-size:11px;border-radius:9px;padding:0 7px;line-height:18px;border:1px solid;white-space:nowrap}
.cd.g{color:#667;border-color:#c6ccd3;background:#f4f6f8}
.cd.o{color:#b86a00;border-color:#f0c27a;background:#fff4e0}
.cd.r{color:#b4233a;border-color:#f0aab6;background:#fde9ed}
.empty{color:var(--mute);font-size:12px;padding:6px 2px}
.later{font-size:12px;color:var(--mute);padding:2px 0;display:flex;justify-content:space-between;gap:6px;cursor:pointer}
.later span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lg{border:1px solid var(--line);border-left:4px solid var(--c);background:#fff;border-radius:8px;padding:4px 9px}
.lg.on{background:var(--cbg)}
.lg:not(.on){opacity:.45;text-decoration:line-through}
#back{display:none}
.badge[hidden]{display:none}
body.vppl #sync{left:auto;right:8px}
#sync{position:fixed;left:8px;bottom:max(6px,env(safe-area-inset-bottom));font-size:11px;color:var(--mute);background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:1px 8px;z-index:20;cursor:pointer}
#sync.ok{color:#0a7a3b;border-color:#a8dcbc}
#sync.bad{color:#b4233a;border-color:#f0aab6}
.fab{position:fixed;right:16px;bottom:max(18px,env(safe-area-inset-bottom));width:52px;height:52px;border-radius:26px;border:0;background:var(--acc);color:#fff;font-size:28px;box-shadow:0 6px 16px rgba(15,118,110,.45);z-index:15;display:none}
/* dialogs */
dialog{border:0;border-radius:14px;padding:0;width:min(520px,calc(100vw - 20px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(10,20,40,.35);color:var(--ink)}
dialog::backdrop{background:rgba(15,25,40,.45)}
dialog.wide{width:min(860px,calc(100vw - 20px))}
.dl{padding:16px 18px;overflow:auto;max-height:calc(100dvh - 24px)}
.dl h2{margin:0 0 12px;font-size:17px}
.fr{display:flex;gap:10px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.fr label.l{width:62px;color:var(--mute);font-size:12px;flex:none}
input[type=text],input[type=date],input[type=time],input[type=url],input[type=password],select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink);min-width:0}
input.fl,textarea.fl{flex:1}
textarea{width:100%;resize:vertical}
.opt{display:inline-flex;align-items:center;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:5px 10px;cursor:pointer;gap:5px;background:#fff}
.opt:has(input:checked){background:var(--cbg);font-weight:600}
.opt input{display:none}
.wd{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--line);border-radius:17px;cursor:pointer}
.wd:has(input:checked){background:var(--acc);border-color:var(--acc);color:#fff}
.wd input{display:none}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--mute)}
table.pv{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
table.pv th{text-align:left;color:var(--mute);font-weight:500;padding:3px 4px}
table.pv td{padding:3px 4px;border-top:1px solid var(--line2);vertical-align:middle}
table.pv input[type=text]{width:100%}
table.pv .bad input.dt{border-color:#e07587;background:#fff4f6}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#1f2a37;color:#fff;padding:8px 14px;border-radius:18px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
@media (max-width:899px){
  #side{position:absolute;z-index:30;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .2s;box-shadow:8px 0 30px rgba(10,20,40,.2);width:min(300px,86vw)}
  #side.open{transform:none}
  #back.open{display:block;position:absolute;inset:0;background:rgba(15,25,40,.35);z-index:25}
  .fab{display:block}
  .hideM{display:none}
  .top{gap:4px;padding-left:6px;padding-right:6px}
  .top .btn{padding:6px 7px;font-size:13px}
  .btn.ico{width:30px}
  #btnSide{padding:6px 7px}
  .lbD{display:none}.lbM{display:inline}
  .seg button{padding:6px 8px}
  #range{font-size:14px;order:9;flex-basis:100%;margin:0 2px}
  .sp{display:none}

}
.tabs{display:flex;gap:4px;padding:max(4px,env(safe-area-inset-top)) 10px 0;background:var(--panel)}
.tabs button{border:0;background:none;padding:7px 14px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
#ppl{display:none;flex:1;min-height:0;flex-direction:column;font-size:15px}
body.vppl #ppl{display:flex}
body.vppl .top,body.vppl .main,body.vppl .fab{display:none!important}
.pbar{display:flex;gap:8px;align-items:center;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--line);flex-wrap:nowrap}
.pbody{flex:1;min-height:0;display:flex}
.pl-list{width:250px;flex:none;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:8px}
.pl-main{flex:1;min-width:0;overflow:auto;padding:12px 14px}
.pi{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer;gap:6px;line-height:1.3}
.pi:hover{background:#f1f4f7}.pi.on{background:var(--accbg)}
.pi small{color:var(--mute)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
table.rv{border-collapse:collapse;width:100%;font-size:13px}
table.rv th{text-align:left;color:var(--mute);font-weight:500;padding:4px 6px}
table.rv td{padding:4px 6px;border-top:1px solid var(--line2)}
input.wt{width:58px}
.tag{display:inline-block;border-radius:9px;padding:0 8px;line-height:18px;font-size:11px;background:#eef1f4;color:#445;font-weight:500}
.tag.pj{background:#e1eefb;color:#2b5d94}
.star{display:flex;gap:8px;padding:7px 0;border-top:1px solid var(--line2);align-items:flex-start;cursor:pointer}
.star:hover{background:#f8fafb}
.star .tn{width:20px;text-align:center;font-weight:700;flex:none}
.tn.p{color:#0a7a3b}.tn.n{color:#b4233a}.tn.z{color:var(--mute)}
.star .stx{flex:1;min-width:0;word-break:break-all}
.star .stx small{display:block;color:var(--mute)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.fc{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:12px}
.fc.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ptabs{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px}
.ptabs::-webkit-scrollbar{display:none}
.pt{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 14px;font-size:15px;font-weight:600;flex:none}
.pt.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pt.gone{opacity:.55}
.pt.add{padding:6px 13px;font-weight:700;color:var(--acc);border-style:dashed}
.ped{margin-left:6px;opacity:.85}
.lb{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.le{display:flex;gap:6px;align-items:flex-start;margin-bottom:4px;font-size:13px}
.le b{color:var(--mute);flex:none;font-weight:600}
.etx{flex:1;min-width:0;word-break:break-all;line-height:1.35;border-radius:4px;padding:0 2px}
.etx:focus{outline:1px solid var(--acc);background:#fff}
.lnew{width:100%;font-size:14px;margin:4px 0}
.lr{display:flex;gap:6px}
.lr input[type=date]{flex:1;min-width:0;font-size:13px}
.pb.on{background:var(--accbg);border-color:var(--acc)}
.sh td.c{vertical-align:top}
.sh-wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 12px;gap:8px;--cnw:280px;--cw:220px}
.lgd{display:flex;gap:6px;flex-wrap:wrap}
.lgi{display:flex;flex-direction:column;border-radius:9px;padding:4px 12px;font-size:12px;line-height:1.35;min-width:104px}
.lgi b{font-size:16px}
.shb{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mchips{display:flex;gap:4px;flex-wrap:wrap;margin-left:6px}
.sh{flex:1;min-height:0;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
.sh table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content}
.sh th,.sh td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:5px 8px;vertical-align:middle;background:#fff;font-size:15px}
.sh .cn{position:sticky;left:0;z-index:2;background:#f7f9fb}
.sh thead th{position:sticky;z-index:3;background:#eef2f6;text-align:left;font-weight:600}
.sh thead tr:nth-child(1) th{top:0;height:46px}
.sh thead tr:nth-child(2) th{top:46px;height:42px}
.sh thead th.cn{z-index:5}
.sh .chr{display:flex;gap:4px;align-items:center}
.sh .chr select,.sh .ch2 select{flex:1;min-width:0;font-size:15px;font-weight:700}
.sh .ch2 select{font-weight:500}
.sh .x{border:0;background:none;color:var(--mute);padding:2px 4px;font-size:13px}
.sh tr.mrow td{background:#ffe98a;font-weight:700;font-size:16px;cursor:pointer;height:36px}
.sh tr.mrow td.cn{background:#ffe98a}
.sh tr.mrow small{font-weight:400;color:#7a6a20;margin-left:6px}
.sh .ops{display:flex;align-items:center;gap:2px}
.sh .mn{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-weight:600;font-size:15px;padding:4px 2px;border-radius:6px}
.sh .mn:focus{background:#fff;outline:1px solid var(--acc)}
.sh td.addr{color:var(--acc);cursor:pointer;font-size:14px;height:32px}
.sh td.addr2{background:#fcfdfd}

.sh td.out{background:repeating-linear-gradient(135deg,#f1f3f5 0 6px,#e8ebee 6px 12px)}
.sl{display:flex;align-items:center;gap:6px}
.sc{width:54px;height:40px;text-align:center;font-size:24px;font-weight:700;border:1px solid var(--line);border-radius:10px;background:#fff;font-family:inherit}
.sc:focus{outline:2px solid var(--acc)}
.s5{background:#bfe8cc}.s4{background:#d8f0c8}.s3{background:#fff3b8}.s2{background:#ffe0b3}.s1{background:#ffc9c0}.s0{background:#f5a9ab}
.gl{font-size:14px;font-weight:700;color:#445;min-width:26px}
.pb{border:1px solid var(--line);border-radius:14px;background:#fff;padding:3px 10px;font-size:14px;margin-left:auto}
.pb.has{background:var(--c-important-bg);border-color:var(--c-important);color:#8a4e00;font-weight:700}
.lp{font-size:13px;color:#33404d;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;line-height:1.35}
.lp b{color:var(--mute)}
.sh tfoot td{position:sticky;background:#eef2f6;font-weight:700;text-align:center;height:34px;font-size:16px}
.sh tfoot tr.f0 td{bottom:68px}.sh tfoot tr.f1 td{bottom:34px}.sh tfoot tr.f2 td{bottom:0}
.sh tfoot td.cn{z-index:5;text-align:left}
.lgrow{display:flex;gap:6px;align-items:flex-start;margin-bottom:8px}
.lgrow input{flex:none}
.lgrow textarea{flex:1}
button.opt.s5,button.opt.s4,button.opt.s3,button.opt.s2,button.opt.s1,button.opt.s0{border:1px solid var(--line)}
@media (max-width:899px){
  .sh-wrap{--cnw:170px;--cw:190px}
  .sh .mv{display:none}
}
.opt.pp:has(input:checked){background:var(--accbg)}
@media (prefers-reduced-motion:reduce){#side{transition:none}}

/* unified compact look (matches calendar / iCheck feel) */
#ppl{font-size:14px}
#ppl input[type=text],#ppl input[type=date],#ppl select,#ppl textarea{font-size:14px}
.pbar{padding:6px 10px;gap:6px}
.ptabs{gap:4px}
.pt{border-radius:8px;padding:6px 12px;font-size:14px;font-weight:500;line-height:1.2}
.pt.on{font-weight:700}
.pt.add{padding:6px 11px;border-style:dashed}
.lgd{gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.lgi{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:6px;min-width:0;border-radius:0;padding:3px 10px;font-size:12px;line-height:1.3;border-right:1px solid rgba(0,0,0,.07)}
.lgi b{font-size:13px}
.sh-wrap{padding:8px 10px;gap:6px}
.sh{border-radius:8px}
.sh th,.sh td{padding:3px 6px;font-size:14px}
.sh thead tr:nth-child(1) th{height:38px}
.sh thead tr:nth-child(2) th{top:38px;height:34px}
.sh .chr select,.sh .ch2 select{font-size:14px;padding:3px 4px}
.sh tr.mrow td{height:28px;font-size:14px;background:#ffeea0}
.sh tr.mrow td.cn{background:#ffeea0}
.sh .mn{font-size:14px;padding:2px}
.sh td.addr{height:26px;font-size:13px}
.sc{width:40px;height:30px;font-size:18px;border-radius:7px}
.gl{font-size:12px;min-width:20px}
.sl{gap:4px}
.pb{border:1px dashed #7fb3ad;color:var(--acc);background:#fff;padding:0 7px;font-size:12px;line-height:20px;border-radius:11px;margin-left:auto}
.pb.has{border-style:solid;background:#e6f4f2;color:#0b5f58;font-weight:700}
.pb.on{background:var(--accbg)}
.lp{font-size:12px;-webkit-line-clamp:2;margin-top:2px}
.le{font-size:12px}
.lnew{font-size:13px;padding:3px 6px}
.sh tfoot td{height:28px;font-size:14px}
.sh tfoot tr.f0 td{bottom:56px}.sh tfoot tr.f1 td{bottom:28px}
.card{border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card h3{font-size:13px}
.fc{font-size:12px;padding:2px 9px}
.star{padding:5px 0;font-size:13px}

/* no scrollbars, comments always visible, persons row */
#ppl *,#side{scrollbar-width:none;-ms-overflow-style:none}
#ppl *::-webkit-scrollbar,#side::-webkit-scrollbar{display:none}
.pbar2{display:flex;padding:4px 10px;background:#fff;border-bottom:1px solid var(--line)}
.sh{user-select:none;-webkit-user-select:none;cursor:grab}
.sh.pan{cursor:grabbing}
.sh .etx,.sh input{user-select:text;-webkit-user-select:text;cursor:text}
.sh button,.sh select,.sh [data-act]{cursor:pointer}
.lb{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line)}
.le{font-size:13px;align-items:flex-start;gap:6px;margin-bottom:3px}
.le b{font-size:13px;color:#33404d}
.le .x{margin-left:auto;flex:none}
.etx{font-size:13px;color:#222}
.more{display:block;font-size:12px;font-weight:700;color:var(--acc);cursor:pointer;margin:2px 0}
.ad2{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line)}
.sh{scroll-padding-top:84px;scroll-padding-bottom:96px}

/* iCheck-style top: underline tabs + filter bar */
.vtabs{display:flex;gap:18px;align-items:center}
.vtabs button{border:0;background:none;padding:8px 4px;font-size:15px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;border-radius:0}
.vtabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.pbar{padding:0 14px;padding-top:max(0px,env(safe-area-inset-top));gap:0}
.pfilter{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#eceef2;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.pall{border:1px solid #c9d0d8;background:#fff;color:#1a1f26;font-weight:700;font-size:13px;padding:6px 14px;border-radius:16px;flex:none}
.pall.on{background:#1a1f26;color:#fff;border-color:#1a1f26}
.vd{width:1px;height:28px;background:#cfd5dc;flex:none}
.pgroup{display:flex;align-items:center;gap:8px;border:1px dashed #b9c0c9;border-radius:10px;padding:5px 10px;flex:none}
.plb{display:flex;flex-direction:column;line-height:1.15;margin-right:2px}
.plb b{font-size:13px;color:#33404d}
.plb small{font-size:10px;color:var(--mute)}
.pc{display:inline-flex;align-items:center;gap:6px;border:1px solid #c9d0d8;background:#fff;color:#5b6672;font-weight:700;font-size:13px;padding:4px 12px;border-radius:16px;flex:none}
.pc .bx{width:12px;height:12px;border:1.5px solid #8a94a0;border-radius:3px;display:inline-block}
.pc.on{background:#1a1f26;color:#fff;border-color:#1a1f26}
.pc.on .bx{background:#fff;border-color:#fff}
.pc.gone{opacity:.55}
.pc.add{border-style:dashed;color:var(--acc)}
.pc .ped{margin-left:2px}

/* score + comments side by side, iCheck-style rows */
.sl2{display:flex;gap:6px;align-items:flex-start}
.sbox{display:flex;align-items:center;gap:4px;flex:none}
.sl2 .lb{flex:1;min-width:0;margin:0;padding:0;border:0}
.sl2 .le{margin-bottom:2px}
.sl2 .pb{flex:none;margin-left:0;width:22px;height:22px;padding:0;line-height:20px;text-align:center;border-radius:11px}
.sl2 .lb:empty{display:none}
.sl2 .lb:empty+.pb{margin-left:auto}
.more{margin:3px 0 0}
.ad2{display:flex;gap:4px;align-items:center;border-top:0;margin-top:4px;padding-top:0}
.ad2 input[type=date]{width:110px;flex:none;font-size:12px;padding:3px 4px}
.ad2 .lnew{flex:1;min-width:0;width:auto;margin:0;font-size:13px}
.ad2 .btn{flex:none;padding:4px 10px;font-size:13px}

/* one comment per cell */
.cm{flex:1;min-width:0}
.cdl{position:relative;display:block;font-size:12px;font-weight:700;color:#33404d;cursor:pointer;line-height:1.2}
.cdl.no{display:none}
.cdl .cdt{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer}
.cmx{display:block;min-height:18px;font-size:13px;line-height:1.35;word-break:break-all;padding:0 2px;border-radius:4px}
.cmx:empty::before{content:attr(data-ph);color:#b3bcc6}
.sh .ops{gap:4px}.sh .ops input[type=checkbox]{flex:none;margin:0}
.sh .ten{flex:none;font-size:12px;font-weight:700;color:#0b5f58;background:#e6f4f2;border-radius:9px;padding:1px 8px;white-space:nowrap}
.sh .ten.no{background:#f1f3f5;color:var(--mute);font-weight:500;cursor:pointer}
.sh td:not(.cn),.sh th:not(.cn){border-right:2px solid #aab2bc}
.sh .ops .mn{min-width:0}
.sh .chr select{min-width:0;width:0}
.sh .ops .mn{width:0;flex:1}
.sh td.cn,.sh th.cn{overflow:hidden}
.sh .sl2{flex-direction:column;align-items:stretch;gap:3px}
.sh .sl2 .cm{display:flex;gap:6px;align-items:flex-start;width:100%}
.sh .sl2 .cdl{flex:none;padding-top:1px}
.sh .sl2 .cmx{flex:1;min-width:0}
.sh .sc{cursor:pointer;padding:0;color:#1f2a37;font-family:inherit}
.sc.sna,.lgi.sna{background:#e6e9ed;color:#7a8794}
.sh .sc.sna{border-color:#d5dae0}

/* underline tabs sit directly on the bar's thin line (both views) */
.top{padding-top:max(0px,env(safe-area-inset-top));padding-bottom:0;align-items:stretch}
.top>*{align-self:center;margin-top:6px;margin-bottom:6px}
.top>.vtabs,.pbar>.vtabs{align-self:stretch;margin-top:0;margin-bottom:0;align-items:stretch}
.vtabs button{padding:0 6px;display:flex;align-items:center;margin:0}
.pbar{align-items:stretch}
@media (max-width:899px){
  .top{padding-left:0;padding-right:0;gap:4px}
  .top>*{margin-left:0}
  .top>.vtabs{flex:1 0 100%;padding:0 12px;border-bottom:1px solid var(--line);margin-bottom:2px}
  .top>.vtabs+*{margin-left:6px}
  .vtabs button{padding:8px 6px}
}
.pbar .vtabs button{padding:9px 6px}
@media (max-width:899px){
  .top>*:not(.vtabs){margin-top:4px;margin-bottom:4px}
  .top .btn{font-size:12px;padding:5px 6px}
  .top .btn.ico{width:28px}
  .top .seg button{padding:5px 7px;font-size:12px}
}
.sh td.cn{vertical-align:top}
.sh .ops{height:30px;align-items:center;gap:2px}
.sh .ops .mn{font-size:14px;font-weight:700}
.sh .ops .x{flex:none;opacity:.55}

.sh tfoot tr.f0 td{bottom:84px}.sh tfoot tr.f1 td{bottom:56px}.sh tfoot tr.f2 td{bottom:28px}.sh tfoot tr.f3 td{bottom:0}
.sh tfoot tr.f0 td{font-weight:400;font-size:12px;color:var(--mute)}
.pseg{display:flex;gap:2px}
.pseg button{flex:1;border:1px solid #c9d0d8;background:#fff;border-radius:6px;font-size:12px;font-weight:700;padding:3px 0;color:#5b6672}
.pseg button.on{background:#1a1f26;border-color:#1a1f26;color:#fff}
.sh tr.off td{opacity:.4}

.pcyc{width:100%;border:1px solid #1a1f26;background:#1a1f26;color:#fff;border-radius:6px;font-size:11px;font-weight:700;padding:3px 2px;white-space:nowrap;cursor:pointer}
.shb{flex-wrap:nowrap;align-items:center}
.shb .lgd{flex:0 1 auto;min-width:0;margin-left:8px;overflow-x:auto;width:auto;max-width:none}
.shb .lgi{flex:none}

/* identical tab geometry in both views (no jump when switching) */
.top,.pbar{padding-left:12px;padding-right:12px;padding-top:0;padding-bottom:0}
.vtabs{height:46px;align-self:flex-start;margin:0;gap:18px}
.vtabs button,.pbar .vtabs button{height:46px;padding:0 6px;font-size:15px;line-height:1;margin:0;box-sizing:border-box}
.top>.vtabs,.pbar>.vtabs{margin:0}
.pbar{min-height:47px}
@media (max-width:899px){
  .top{padding-left:0;padding-right:0}
  .top>.vtabs{height:42px;padding:0 12px;margin:0 0 2px}
  .pbar{padding-left:0;padding-right:0;min-height:43px}
  .pbar>.vtabs{height:42px;padding:0 12px}
  .vtabs button,.pbar .vtabs button{height:42px}
}
.top,.pbar{padding-top:env(safe-area-inset-top,0px)}

/* merged person timeline */
.ev2{display:grid;grid-template-columns:64px 1fr auto;gap:8px;padding:7px 8px;border-top:1px solid var(--line2);align-items:start;cursor:pointer;font-size:13px}
.ev2:hover{filter:brightness(.97)}
.ev2 .d{font-size:13px;color:#33404d;white-space:nowrap}
.ev2 .stx{min-width:0;word-break:break-all;line-height:1.4}
.ev2 .stx small{display:block;color:var(--mute);font-size:12px}
.ev2 .rt{text-align:right;white-space:nowrap}
.ev2.sheet{background:#fff4bf;border-top-color:#f1e19a}
.ev2 .tn{display:inline}
.tag.sumtag{background:#fff4bf;color:#5a4a00;cursor:pointer;padding:2px 10px;line-height:1.5}
.tag.scg{background:#fff;border:1px solid #e0d28a;color:#33404d}
.tag.scg.s5,.tag.scg.s4{background:#d8f0c8}.tag.scg.s3{background:#fff3b8}.tag.scg.s2{background:#ffe0b3}.tag.scg.s1{background:#ffc9c0}.tag.scg.s0{background:#f5a9ab}
.stxt{display:inline-block;vertical-align:top;line-height:1.5}

/* continuous 12 / 18 / 23 lines, numbers sit beside the line not on it */
.col .sep{left:-1px;right:0;z-index:3}
.gut .sep{left:0;right:0}
.gut .per{border-bottom:0}
.gut .hl.lo{transform:none;margin-top:5px}
.tag.lnk{cursor:pointer;background:#fff;border:1px solid #c9b84a;color:#5a4a00;font-weight:700}
.tag.lnk:hover{background:#fff9d6}

/* time toggle & font size */
body:not(.hide-time) .tt+.wh::before{content:' · '}
body.hide-time .ev .tt{display:none}
body.hide-time .ev .tm:not(:has(.wh)){display:none}
body.hide-time .ev.lift .tt{display:inline}
body.hide-time .ev.lift .tm{display:block}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.fsrow{display:flex;align-items:center;gap:8px;flex:1}
.fsrow input[type=range]{flex:1}

/* draggable day-column width handle */
#dhs{position:relative}
.cwh{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:col-resize;z-index:8}
.cwh::after{content:"";position:absolute;right:3px;top:25%;bottom:25%;width:2px;border-radius:1px;background:#b9c0c9;opacity:.0;transition:opacity .15s}
.hd:hover .cwh::after,.cwh:hover::after{opacity:1}
#ads,#dhs,.cols{justify-content:start}
.ev.rep{outline:1.5px dashed var(--c);outline-offset:-2px}
.ev.rep.lift{outline-style:solid}

/* calendar edge: thicker light-gray divider */
#dhs,#ads,.cols{box-sizing:border-box;border-right:3px solid #d5dae0}
.ev{padding:3px 7px}
.cpk{width:42px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff;flex:none;cursor:pointer}

/* blue highlight frames */
.cols{position:relative}
.frl{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:9}
.fr2{position:absolute;box-sizing:border-box;border-style:solid;border-radius:3px}
.fr2 .fh,.fr2 .fz,.fr2 .fx,.fr2 .fp{display:none;position:absolute;pointer-events:auto;font-style:normal}
body.fmode .fr2 .fh,body.fmode .fr2 .fz,body.fmode .fr2 .fx,body.fmode .fr2 .fp{display:block}

};

var getEv=function(id){return S.events.find(function(e){return e.id===id})};

/* ---------- view state ---------- */
var V={n:innerWidth<700?3:8,start:null,filter:{urgent:1,important:1,fixed:1,routine:1},monthRef:null};
V.start=V.n>=7?mondayOf(todayS()):todayS();
var visDates=function(){var a=[];for(var i=0;i<V.n;i++)a.push(addDays(V.start,i));return a};
function inRM(e,date){var r=e.rm;if(!r||r.length!==2)return true;var m=+date.slice(5,7),a=r[0],b=r[1];return a<=b?(m>=a&&m<=b):(m>=a||m<=b)}
function occ(date){
  var dow=parseD(date).getDay(),out=[];
  S.events.forEach(function(e){
    if(V.filter[e.cat]===0)return;
    if(e.rdays&&e.rdays.length){
      if(date>=e.date&&e.rdays.indexOf(dow)>=0&&(e.skip||[]).indexOf(date)<0&&inRM(e,date))out.push({e:e,date:date});
    }else if(e.date===date||(e.date2&&date>=e.date&&date<=e.date2))out.push({e:e,date:date});
  });
  return out;
}

function layoutDay(items){
  items.sort(function(a,b){return a.start-b.start||b.end-a.end});
  var groups=[],cur=[],ce=-1;
  items.forEach(function(it){
    if(cur.length&&it.start>=ce){groups.push(cur);cur=[];ce=-1}
    cur.push(it);ce=Math.max(ce,it.end);
  });
  if(cur.length)groups.push(cur);
  groups.forEach(function(g){
    var cols=[];
    g.forEach(function(it){
      var i=cols.findIndex(function(end){return end<=it.start});
      if(i<0){i=cols.length;cols.push(0)}
      cols[i]=it.end;it.col=i;
    });
    g.forEach(function(it){it.cols=cols.length});
  });
}
function evHtml(it,date){

    '<div class="rz rt"></div>'+icoOf(o)+'<div class="ti">'+esc(o.title)+'</div><div class="tm"><span class="tt">'+mm2s(o.start)+'–'+mm2s(o.end)+'</span>'+evTag(o)+'</div><div class="rz rb"></div></div>';
}
function brkHtml(dates,lab){
  var n=dates.length,h='',a=-1;
  for(var i=0;i<=n;i++){
    var wd=i<n&&(function(w){return w!==0&&w!==6})(parseD(dates[i]).getDay());
    if(wd){if(a<0)a=i}
    else if(a>=0){
      h+='<div class="brk'+(lab?' blab':'')+'" title="公司休息 11:30–13:30" style="left:calc('+(a/n*100)+'% + '+(a>0&&parseD(dates[a]).getDay()===1?3:1)+'px);width:calc('+((i-a)/n*100)+'% - '+(a>0&&parseD(dates[a]).getDay()===1?3:1)+'px);right:auto;top:'+Y(BRK_S)+'px;height:'+(Y(BRK_E)-Y(BRK_S))+'px"><span>'+((i-a)>=2?'午休　11:30 – 13:30':'午休')+'</span></div>';
      a=-1;
    }
  }
  return h;
}
var BRK_S=690,BRK_E=810; /* 公司休息 11:30–13:30（週一～五） */

  [['上午',6,12],['下午',12,18],['晚上',18,23]].forEach(function(r){gut+='<div class="per" style="top:'+Y(r[1]*60)+'px;height:'+(Y(r[2]*60)-Y(r[1]*60))+'px">'+r[0]+'</div>'});
  for(var h=6;h<=22;h++)gut+='<div class="hl'+((h===12||h===18)?' lo':'')+'" style="top:'+Y(h*60)+'px">'+pad(h)+'</div>';
  gut+=sepHtml+'<div class="sep" style="top:'+th+'px"></div>';

      return {e:o.e,start:s,end:e};
    });

  }).join('');
  $('#grid').innerHTML='<div class="gut" style="height:'+th+'px">'+gut+'</div><div class="cols" style="grid-template-columns:'+colsTpl()+(colsW()?';width:'+colsW():'')+'">'+cols+brkHtml(dates)+hlinesHtml()+brkHtml(dates,1)+sepAll+framesHtml()+'</div>';

var fitH=0;
function fit(){
  var h=$('#scroller').clientHeight;if(h<120)return;
  fitH=h;
  var W=0;for(var k=6;k<=22;k++)W+=hw(k);
  UNIT=clamp(Math.floor((h-44-9)/W),18,UCAP);
  if(window.matchMedia('(max-width:899px)').matches)UNIT=60;/* 手機：固定每小時高度，只有時間格可上下滑 */
  calcY();
}
function cdBadge(days){
  var c=days>=15?'g':(days>=8?'o':'r');
  return '<span class="cd '+c+'">'+(days===0?'今天':'倒數 '+days+' 天')+'</span>';
}
function reminders(){
  var t=todayS();
  return S.events.filter(function(e){return !(e.rdays&&e.rdays.length)&&e.remind>0&&!e.pack}).map(function(e){return {e:e,days:diffDays(e.date,t)}})
    .filter(function(x){return x.days>=0}).sort(function(a,b){return a.days-b.days});
}
function activeReminders(){return reminders().filter(function(x){return x.days<=x.e.remind*7})}
function md(d){var p=parseD(d);return (p.getMonth()+1)+'/'+p.getDate()+' 週'+WD[p.getDay()]}
function pendingStar(){
  var t=todayS(),lim=addDays(t,-14),n=new Date(),nm=n.getHours()*60+n.getMinutes();
  return S.events.filter(function(e){return e.people&&e.people.length&&!e.starDone&&!(e.rdays&&e.rdays.length)&&e.date>=lim&&(e.date<t||(e.date===t&&(e.allDay||e.end<=nm)))});
}
var packOf=function(id){return (S.packs||[]).find(function(p){return p.id===id})};
function evTag(o){
  var pk=o.pack?packOf(o.pack):null,a=(o.who||[]).slice();
  if(pk)a.push('【'+pk.name+'】');
  return a.length?'<span class="wh">'+esc(a.join('／'))+'</span>':'';
}
function endDate(e){var d=parseD((e.allDay&&e.date2)?e.date2:e.date);if(e.allDay)d.setHours(23,59,59,0);else d.setHours(Math.floor(e.end/60),e.end%60,0,0);return d}
function startDate(e){var d=parseD(e.date);if(e.allDay)d.setHours(0,0,0,0);else d.setHours(Math.floor(e.start/60),e.start%60,0,0);return d}
function sinceList(){
  var n=Date.now();
  var l=S.events.filter(function(e){return e.since&&!(e.rdays&&e.rdays.length)}).map(function(e){
    var st=startDate(e).getTime(),en=endDate(e).getTime();
    return {e:e,st:st,en:en,kind:n>=en?'past':(n<st?'future':'now')};
  });
  var fu=l.filter(function(x){return x.kind!=='past'}).sort(function(a,b){return a.st-b.st}),pa=l.filter(function(x){return x.kind==='past'}).sort(function(a,b){return b.en-a.en});
  return fu.concat(pa);
}
function ymdSpan(a,b){ /* a<b，回傳「N年N月N日」（前面為 0 的單位省略） */
  var A=new Date(a.getFullYear(),a.getMonth(),a.getDate()),B=new Date(b.getFullYear(),b.getMonth(),b.getDate());
  var y=B.getFullYear()-A.getFullYear(),m=B.getMonth()-A.getMonth(),d=B.getDate()-A.getDate();
  if(d<0){m--;d+=new Date(B.getFullYear(),B.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  return y?y+'年'+m+'月'+d+'日':(m?m+'月'+d+'日':d+'日');
}
function shortD(d){var p=parseD(d);return (p.getFullYear()%100)+'/'+(p.getMonth()+1)+'/'+p.getDate()}
function elBadge(x){
  var n=new Date(),days=Math.floor((x.kind==='future'?x.st-n.getTime():n.getTime()-x.en)/864e5);
  if(x.kind==='now')return '<span class="cd r">進行中</span>';
  var same=new Date(x.kind==='future'?x.st:x.en).toDateString()===n.toDateString();
  if(same)return '<span class="cd '+(x.kind==='future'?'r':'g')+'">'+(x.kind==='future'?'今天':'今天已過')+'</span>';
  if(x.kind==='future')return '<span class="cd '+(days<=7?'r':(days<=14?'o':'g'))+'">還有 '+ymdSpan(n,new Date(x.st))+'</span>';
  return '<span class="cd g">已過 '+ymdSpan(new Date(x.en),n)+'</span>';
}
function packInfo(p){
  var n=Date.now(),list=S.events.filter(function(x){return x.pack===p.id}).sort(function(a,b){return a.date.localeCompare(b.date)||a.start-b.start});
  var past=list.filter(function(x){return endDate(x).getTime()<=n}).length;
  var next=list.find(function(x){return endDate(x).getTime()>n});
  return {list:list,past:past,next:next};
}

function setN(n){

/* ---------- batch input ---------- */
var periodAdj=function(p,h){
  if(p){if(/下午|晚上/.test(p))return h<12?h+12:h;if(p==='中午')return h<11?h+12:h;return h}
  return (h>=1&&h<=5)?h+12:h;
};
function takeTime(s){
  var st=null,en=null,m;
  var re1=/(上午|早上|中午|下午|晚上)?\s*(\d{1,2})[:：](\d{2})(?:\s*[-~～—到至]\s*(上午|早上|中午|下午|晚上)?\s*(\d{1,2})[:：](\d{2}))?/;
  var re2=/(上午|早上|中午|下午|晚上)?\s*(\d{1,2})\s*[點点時](半|(\d{1,2})分)?(?:\s*[-~～—到至]\s*(上午|早上|中午|下午|晚上)?\s*(\d{1,2})\s*[點点時](半|(\d{1,2})分)?)?/;
  if((m=s.match(re1))){
    st=(m[1]?periodAdj(m[1],+m[2]):+m[2])*60+(+m[3]);
    if(m[5]!=null)en=((m[4]||m[1])?periodAdj(m[4]||m[1],+m[5]):+m[5])*60+(+m[6]);
    s=s.replace(m[0],' ');
  }else if((m=s.match(re2))){
    st=periodAdj(m[1],+m[2])*60+(m[3]==='半'?30:(m[4]?+m[4]:0));
    if(m[6]!=null)en=periodAdj(m[5]||m[1],+m[6])*60+(m[7]==='半'?30:(m[8]?+m[8]:0));
    s=s.replace(m[0],' ');
  }
  if(st!=null&&en!=null&&en<=st&&en+720>st)en+=720;
  var dur=null;
  if(st!=null&&en==null&&(m=s.match(/(\d+(?:\.\d+)?)\s*(?:小時|小时|hrs?|h)/i))){dur=Math.round(parseFloat(m[1])*60);s=s.replace(m[0],' ');}
  if(st!=null&&en==null)en=st+(dur||60);
  return {s:s,st:st,en:en};
}
function takeDate(s){
  var m,today=todayS(),t=new Date(),date=null,date2='';
  if((m=s.match(/(?:(\d{4})\s*[\/\-.年]\s*)?(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})\s*[日號号]?(?:\s*[-~～—–到至]\s*(?:(\d{1,2})\s*[\/\-.月]\s*)?(\d{1,2})\s*[日號号]?)?/))){
    var mo=+m[2],da=+m[3];
    if(mo>=1&&mo<=12&&da>=1&&da<=31){
      var y=m[1]?+m[1]:t.getFullYear();
      var c=new Date(y,mo-1,da);
      if(!m[1]&&diffDays(ymd(c),today)<-30)c=new Date(y+1,mo-1,da);
      date=ymd(c);
      if(m[5]){
        var mo2=m[4]?+m[4]:mo,da2=+m[5];
        if(mo2>=1&&mo2<=12&&da2>=1&&da2<=31){
          var c2=new Date(c.getFullYear(),mo2-1,da2);
          if(c2<c)c2=new Date(c.getFullYear()+1,mo2-1,da2);
          var d2=ymd(c2);if(d2>date&&diffDays(d2,date)<=400)date2=d2;
        }
      }
      s=s.replace(m[0],' ');
    }
  }
  if(!date&&(m=s.match(/(大後天|後天|明天|明日|今天|今日)/))){
    date=addDays(today,{'大後天':3,'後天':2,'明天':1,'明日':1,'今天':0,'今日':0}[m[1]]);s=s.replace(m[0],' ');
  }
  if(!date&&(m=s.match(/(下下|下|這|本)?\s*(?:週|周|星期|禮拜)([一二三四五六日天])/))){
    var idx='一二三四五六日天'.indexOf(m[2]);if(idx===7)idx=6;
    var off=m[1]==='下下'?14:(m[1]==='下'?7:0);
    var d=addDays(mondayOf(today),idx+off);
    if(!m[1]&&d<today)d=addDays(d,7);
    date=d;s=s.replace(m[0],' ');
  }
  return {s:s,date:date,date2:date2};
}
function guessCat(t){
  if(/緊急|急件|deadline|死線/i.test(t))return 'urgent';
  if(/交通|通勤|上班|下班|接送|送孩子|午餐|晚餐|睡/.test(t))return 'fixed';
  if(/服事|會議|Mtg|檢討|審查|FAI|Kick|簡報|面談|訪談|review/i.test(t))return 'important';
  return 'routine';
}

function tplFind(title){
  return (S.tpls||[]).find(function(t){return [t.name].concat((t.keys||'').split(/[,，、\s]+/)).filter(Boolean).some(function(k){return title.indexOf(k)>=0})});
}
function parseBatch(text){
  var out=[];
  text.split(/[;；\n]+/).map(function(x){return x.trim()}).filter(Boolean).forEach(function(raw){
    var s=raw.replace(/[（(]\s*[日一二三四五六]\s*[）)]/g,' '),m,remind=null;

    var tt=takeTime(s);s=tt.s;
    var dd=takeDate(s);s=dd.s;
    var clean=function(x){return x.replace(/[，,、。]+/g,' ').replace(/\s+/g,' ').replace(/^[\s:：\-—]+|[\s:：\-—]+$/g,'')};
    /* 範本：標題含範本名稱／關鍵字 → 套用時間、分類、小符號；可一次寫多個日期 */
    var ex=[],sx=s,dx;while(dd.date&&ex.length<40&&(dx=takeDate(sx)).date){ex.push(dx.date);sx=dx.s}

    if(tp){
      var mk=function(t,d,st,en,rm){return {raw:raw,on:true,date:d,date2:'',allDay:false,start:clamp(st,T0,T1-15),end:clamp(en,st+15,T1),title:t.name,cat:catId(t.cat),remind:rm,icon:t.icon||autoIcon(t.cat),tpl:t.id}};
      [dd.date].concat(ex).forEach(function(d){
        var st=tt.st!=null?tt.st:tp.start,en=tt.en!=null?tt.en:(tt.st!=null?Math.min(tt.st+(tp.end-tp.start),T1):tp.end);
        out.push(mk(tp,d,st,en,remind==null?(tp.remind||0):remind));
        /* 連動：同一週（週一～週日）另外一天自動加上連動範本 */
        (tp.links||[]).forEach(function(lk){
          var lt=(S.tpls||[]).find(function(x){return x.id===lk.tpl});if(!lt)return;
          var ld=addDays(mondayOf(d),(lk.wd+6)%7);
          out.push(mk(lt,ld,lt.start,lt.end,lt.remind||0));

      return;
    }
    var title=clean(s)||(dd.date?'事件':'');

}

/* ---------- cloud sync ---------- */
var pushT,dirty=false,pushing=false;
var SYNC_TXT={local:'本機（未同步）',busy:'同步中…',ok:'已同步',off:'離線，稍後重試',bad:'金鑰或網址錯誤'};
function setSync(s){var el=$('#sync');el.textContent=SYNC_TXT[s]+' · v'+APP_VERSION;el.className=s==='ok'?'ok':(s==='bad'?'bad':'');}
$('#sync').onclick=function(){if(CF.url)pull();else $('#btnSet').onclick();};
function schedulePush(){if(!CF.url)return;dirty=true;clearTimeout(pushT);pushT=setTimeout(push,1500);}
async function push(){
  if(!CF.url||pushing)return;pushing=true;setSync('busy');
  try{
    var r=await fetch(CF.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'push',key:CF.key||'',doc:S})});
    var j=await r.json();
    if(j.ok){dirty=false;LOCK.ok=true;setLock(false);setSync('ok')}else setSync('bad');
  }catch(e){setSync('off')}
  pushing=false;
}
async function pull(){
  if(!CF.url){setSync('local');return}
  setSync('busy');
  try{
    var r=await fetch(CF.url+'?action=pull&key='+encodeURIComponent(CF.key||''));
    var j=await r.json();
    if(!j.ok){setSync('bad');LOCK.ok=false;setLock(true);return}
    LOCK.ok=true;setLock(false);
    if(j.doc&&(j.doc.v||0)>(S.v||0)){S=j.doc;ensure();UNDO.st=[];UNDO.re=[];UNDO.last=JSON.stringify(S);persistLocal();renderAll();if(document.body.classList.contains('vppl'))renderPpl();setSync('ok')}
    else if(!j.doc||(S.v||0)>(j.doc.v||0)){await push()}
    else setSync('ok');
  }catch(e){setSync('off');LOCK.ok=false;setLock(true)}
}
window.addEventListener('online',function(){if(dirty)push();else pull()});

function reviewTable(p,st){

function focusCell(td,dr,dc){
  var tr=td.parentElement,r=tr.rowIndex,c=td.cellIndex,tb=tr.parentElement.parentElement;

    r+=dr;c+=dc;var row=tb.rows[r];if(!row)return false;var cell=row.cells[c];

function cycleScore(btn,dir){

ppl.addEventListener('keydown',function(e){
  var t=e.target;
  if(/^st_(s|tk|a|r)$/.test(t.id)&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();addStarInline();return}
  if(t.id==='st_t'&&e.key==='Enter'){e.preventDefault();addStarInline();return}
  if(t.classList&&t.classList.contains('lnew')&&e.key==='Enter'){e.preventDefault();addLog(t.dataset.ln,t.closest('.ad2'));return}
  if(t.dataset&&(t.dataset.le||t.dataset.cm)&&e.key==='Enter'){e.preventDefault();t.blur();return}
  if(t.dataset&&t.dataset.itn&&e.key==='Enter'){t.blur();return}
  if(!t.classList.contains('sc'))return;
  if(/^[0-5]$/.test(e.key)){e.preventDefault();setScore(t,+e.key);focusCell(t.closest('td'),1,0);return}
  if(e.key==='-'||e.key==='n'||e.key==='N'){e.preventDefault();setScore(t,'na');return}
  if(e.key==='Backspace'||e.key==='Delete'||e.key==='Escape'){e.preventDefault();setScore(t,null);return}
  var m={ArrowDown:[1,0],Enter:[1,0],ArrowUp:[-1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
  if(m){e.preventDefault();focusCell(t.closest('td'),m[0],m[1])}
});

});

function addStarInline(){
  var p=perOf(P.pid);if(!p)return;
  var g=function(id){var el=$('#'+id);return el?el.value.trim():''};
  var txt=P.mode==='c'?g('st_t'):'',sv={s:g('st_s'),t:g('st_tk'),a:g('st_a'),r:g('st_r')};
  if(P.mode==='c'&&!txt){$('#st_t').focus();return}
  if(P.mode==='s'&&!(sv.s||sv.t||sv.a||sv.r)){$('#st_a').focus();return}
  S.stars.push({id:uid(),pid:p.id,date:$('#st_d').value||todayS(),dim:'',tone:P.addTone,text:txt,proj:$('#st_p').value,s:sv.s,t:sv.t,a:sv.a,r:sv.r,ts:Date.now()});
  save();renderPpl();toast('已記錄');var f=$(P.mode==='c'?'#st_t':'#st_s');if(f)f.focus();
}

/* ----- dialogs ----- */
function openPerson(p,cb){
  var e=p||{name:'',role:'',since:'',left:'',note:''};
  dlg.classList.remove('wide');
  dlg.innerHTML='<div class="dl"><h2>'+(p?'編輯人員':'新增人員')+'</h2>'+
  '<div class="fr"><label class="l">姓名</label><input type="text" class="fl" id="p_n" value="'+esc(e.name)+'"></div>'+
  '<div class="fr"><label class="l">職稱</label><input type="text" class="fl" id="p_r" value="'+esc(e.role)+'" placeholder="例：設計師、PL"></div>'+
  '<div class="fr"><label class="l">到職日</label><input type="date" id="p_s" value="'+(e.since||'')+'"><span class="hint">用來自動算年資（2y9m）</span></div>'+
  '<div class="fr"><label class="l">離開日</label><input type="date" id="p_l" value="'+(e.left||'')+'"><span class="hint">離開／調離後歷史仍保留</span></div>'+
  '<div class="fr"><label class="l">備註</label><textarea id="p_o" rows="2" class="fl">'+esc(e.note||'')+'</textarea></div>'+
  '<div class="acts">'+(p?'<button class="btn danger" id="p_del">刪除</button>':'')+'<span class="sp" style="flex:1"></span><button class="btn" id="p_x">取消</button><button class="btn pri" id="p_ok">儲存</button></div></div>';
  var q=function(s){return dlg.querySelector(s)};
  q('#p_x').onclick=function(){dlg.close()};
  q('#p_ok').onclick=function(){
    var n=q('#p_n').value.trim();if(!n){q('#p_n').focus();return}
    var o=p||{id:uid()};Object.assign(o,{name:n,role:q('#p_r').value.trim(),since:q('#p_s').value,left:q('#p_l').value,note:q('#p_o').value.trim()});
    if(!p){S.people.push(o);P.pid=o.id;if(!cb)P.tab='people'}
    save();dlg.close();if(cb)cb(o);renderPpl();renderSide();
  };
  var d=q('#p_del');
  if(d)d.onclick=function(){
    if(!confirm('刪除「'+p.name+'」？他的 STAR、專案分數、年度考核都會一併刪除，無法復原。若只是離開專案，請改填「離開日」。'))return;
    S.people=S.people.filter(function(x){return x.id!==p.id});S.stars=S.stars.filter(function(x){return x.pid!==p.id});
    Object.keys(S.sheets).forEach(function(y){var sh=S.sheets[y];sh.cols=sh.cols.filter(function(c){return c.pid!==p.id})});
    Object.keys(S.reviews).forEach(function(y){delete S.reviews[y][p.id]});
    S.events.forEach(function(ev){if(ev.people)ev.people=ev.people.filter(function(i){return i!==p.id})});
    P.pid=null;save();dlg.close();renderPpl();renderSide();
  };
  dlg.showModal();if(!p)q('#p_n').focus();
}
function openSheetEntry(y,itId,colId){
  var sh=sheetOf(y),f=findItem(sh,itId),col=sh.cols.find(function(c){return c.id===colId}),cl=cellOf(sh,itId,colId);
  if(!f||!col||!cl||!cl.log.length)return;
  var l=cl.log[0],p=perOf(col.pid)||{name:''};
  var sc=typeof cl.s==='number'?'　分數 '+cl.s+' '+GR[5-cl.s][0]:(cl.s==='na'?'　不適用':'');
  dlg.classList.remove('wide');
  dlg.innerHTML='<div class="dl"><h2>編輯考核評語</h2><div class="hint" style="margin:-6px 0 10px">'+esc(p.name)+' · '+y+'／'+f.m+'月評比 · '+esc(f.it.name||'')+(col.proj?' · '+esc(projName(col.proj)):'')+sc+'</div>'+
    '<div class="fr"><label class="l">日期</label><input type="date" id="e_d" value="'+l.date+'"></div>'+
    '<div class="fr"><label class="l">評語</label><textarea id="e_t" rows="3" class="fl">'+esc(l.text)+'</textarea></div>'+
    '<div class="acts"><button class="btn danger" id="e_del">刪除評語</button><span class="sp" style="flex:1"></span><button class="btn" id="e_go">到考核表</button><button class="btn" id="e_x">取消</button><button class="btn pri" id="e_ok">儲存</button></div></div>';
  var q=function(x){return dlg.querySelector(x)};
  q('#e_x').onclick=function(){dlg.close()};
  q('#e_ok').onclick=function(){
    var t=q('#e_t').value.trim();
    if(!t){cl.log=[]}else{l.text=t;l.date=q('#e_d').value||l.date}
    save();dlg.close();renderPpl();renderSide();toast('已儲存');
  };
  q('#e_del').onclick=function(){if(!confirm('刪除這則考核評語？（分數不受影響）'))return;cl.log=[];save();dlg.close();renderPpl()};
  q('#e_go').onclick=function(){dlg.close();P.tab='sheet';P.year=y;P.needJump=false;P.collapsed[f.m]=false;renderPpl();flashItem(itId)};
  dlg.showModal();
}
function openStar(o){
  var r=o.edit,pids=o.pids||(r?[r.pid]:(P.pid?[P.pid]:[]));
  var e=r||{date:o.date||todayS(),dim:P.addDim,tone:1,text:o.text||'',proj:o.proj||'',s:'',t:'',a:'',r:''};
  dlg.classList.remove('wide');
  dlg.innerHTML='<div class="dl"><h2>'+(r?'編輯紀錄':'記錄表現（STAR）')+'</h2>'+
  (r?'<div class="fr"><label class="l">人員</label><b>'+esc((perOf(r.pid)||{}).name||'')+'</b></div>':'<div class="fr"><label class="l">人員</label>'+S.people.filter(function(p){return !p.left||pids.indexOf(p.id)>=0}).map(function(p){return '<label class="opt pp" style="--c:#9aa7b4"><input type="checkbox" name="sp" value="'+p.id+'"'+(pids.indexOf(p.id)>=0?' checked':'')+'>'+esc(p.name)+'</label>'}).join('')+'</div>')+
  '<div class="fr"><label class="l">日期</label><input type="date" id="s_d" value="'+e.date+'"><select id="s_p"><option value="">（專案）</option>'+S.projects.map(function(x){return '<option value="'+x.id+'"'+(e.proj===x.id?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select></div>'+
  '<div class="fr"><label class="l">評價</label>'+[[1,'＋ 做得好'],[0,'○ 中性'],[-1,'－ 待改進']].map(function(t){return '<label class="opt pp" style="--c:#9aa7b4"><input type="radio" name="st" value="'+t[0]+'"'+(e.tone===t[0]?' checked':'')+'>'+t[1]+'</label>'}).join('')+'</div>'+
  '<div class="fr"><label class="l">一句話</label><input type="text" class="fl" id="s_t" value="'+esc(e.text)+'"></div>'+
  '<details'+((e.s||e.t||e.a||e.r)?' open':'')+'><summary class="hint">S／T／A／R（選填）</summary>'+['s:S 情境','t:T 任務','a:A 行動','r:R 結果'].map(function(z){var a=z.split(':');return '<div class="fr"><label class="l">'+a[1]+'</label><textarea id="s_'+(a[0]==='t'?'tk':a[0])+'" rows="2" class="fl">'+esc(e[a[0]]||'')+'</textarea></div>'}).join('')+'</details>'+
  '<div class="acts">'+(r?'<button class="btn danger" id="s_del">刪除</button>':'')+'<span class="sp" style="flex:1"></span><button class="btn" id="s_x">取消</button><button class="btn pri" id="s_ok">儲存</button></div></div>';
  var q=function(s){return dlg.querySelector(s)};
  q('#s_x').onclick=function(){dlg.close()};
  var del=q('#s_del');if(del)del.onclick=function(){S.stars=S.stars.filter(function(x){return x.id!==r.id});save();dlg.close();renderPpl()};
  q('#s_ok').onclick=function(){
    var txt=q('#s_t').value.trim();if(!txt&&!(q('#s_s').value.trim()||q('#s_tk').value.trim()||q('#s_a').value.trim()||q('#s_r').value.trim())){q('#s_t').focus();return}
    var dim=r?(r.dim||''):'',tone=+(dlg.querySelector('[name=st]:checked')||{value:1}).value;
    var f={date:q('#s_d').value||todayS(),proj:q('#s_p').value,dim:dim,tone:tone,text:txt,s:q('#s_s').value.trim(),t:q('#s_tk').value.trim(),a:q('#s_a').value.trim(),r:q('#s_r').value.trim()};
    if(r)Object.assign(r,f);
    else{
      var ids=[].slice.call(dlg.querySelectorAll('[name=sp]:checked')).map(function(x){return x.value});
      if(!ids.length){toast('請選至少一位人員');return}
      ids.forEach(function(id){S.stars.push(Object.assign({id:uid(),pid:id,ts:Date.now()},f))});
      if(o.evId){var ev=getEv(o.evId);if(ev)ev.starDone=true}
      P.addDim=dim;
    }
    save();dlg.close();renderPpl();renderSide();toast('已記錄');
  };
  dlg.showModal();
}

function openLog(itId,colId){
  var sh=sheetOf(P.year),f=findItem(sh,itId),col=sh.cols.find(function(c){return c.id===colId});if(!f||!col)return;
  var p=perOf(col.pid)||{name:''};
  dlg.classList.remove('wide');
  function draw(){
    var cl=cellOf(sh,itId,colId,true),logs=cl.log.slice().sort(function(a,b){return b.date.localeCompare(a.date)});
    dlg.innerHTML='<div class="dl"><h2>'+esc(p.name)+' · '+esc(f.it.name||'（未命名）')+'</h2><div class="hint" style="margin:-6px 0 8px">'+P.year+'／'+f.m+'月評比'+(col.proj?'／'+esc(projName(col.proj)):'')+'</div>'+
    '<div class="fr"><label class="l">分數</label>'+LEG.map(function(l){return '<button class="opt s'+l[3]+'" style="--c:#9aa7b4;'+(cl.s===l[3]?'outline:2px solid var(--acc);':'')+'" data-sv="'+l[3]+'"><b>'+l[3]+'</b> '+l[1]+'</button>'}).join('')+'<button class="btn" data-sv="">清除</button></div>'+
    '<div class="hint" style="margin-bottom:6px">'+(cl.s==null?'尚未評分':LEG.find(function(l){return l[3]===cl.s})[0]+'　'+LEG.find(function(l){return l[3]===cl.s})[2])+'</div>'+
    '<div class="fr"><label class="l">新增</label><input type="date" id="g_d" value="'+todayS()+'"><button class="btn pri" id="g_add">加入</button></div>'+
    '<textarea id="g_t" rows="3" placeholder="評語（例：點子不錯，表現技法需加強）"></textarea>'+
    '<div style="margin-top:10px">'+(logs.map(function(l){return '<div class="lgrow"><input type="date" data-ld="'+l.id+'" value="'+l.date+'"><textarea rows="2" data-lt="'+l.id+'">'+esc(l.text)+'</textarea><button class="x" data-lx="'+l.id+'" title="刪除">✕</button></div>'}).join('')||'<div class="empty">還沒有評語。加入後會顯示在格子裡，也會出現在這個人的人員頁。</div>')+'</div>'+
    '<div class="acts"><button class="btn pri" id="g_x">完成</button></div></div>';
  }
  draw();
  dlg.onclick=function(e){
    if(e.target===dlg){dlg.close();return}
    var sv=e.target.closest('[data-sv]');
    if(sv){var cl=cellOf(sh,itId,colId,true);cl.s=sv.dataset.sv===''?null:+sv.dataset.sv;save();draw();renderPpl();return}
    var lx=e.target.closest('[data-lx]');
    if(lx){var c2=cellOf(sh,itId,colId,true);c2.log=c2.log.filter(function(l){return l.id!==lx.dataset.lx});save();draw();renderPpl();return}
    if(e.target.id==='g_add'){
      var tx=dlg.querySelector('#g_t').value.trim();if(!tx){dlg.querySelector('#g_t').focus();return}
      cellOf(sh,itId,colId,true).log.push({id:uid(),date:dlg.querySelector('#g_d').value||todayS(),text:tx});save();draw();renderPpl();return;
    }
    if(e.target.id==='g_x')dlg.close();
  };
  dlg.onchange=function(e){
    var t=e.target,c=cellOf(sh,itId,colId,true);
    if(t.dataset.ld){var l=c.log.find(function(x){return x.id===t.dataset.ld});if(l){l.date=t.value||l.date;save();renderPpl()}}
    else if(t.dataset.lt){var l2=c.log.find(function(x){return x.id===t.dataset.lt});if(l2){l2.text=t.value.trim();save();renderPpl()}}
  };
  dlg.addEventListener('close',function h(){dlg.removeEventListener('close',h);dlg.onclick=function(e){if(e.target===dlg)dlg.close()};dlg.onchange=null;});
  dlg.showModal();
}
function openProjects(){
  dlg.classList.remove('wide');
  function draw(){
    dlg.innerHTML='<div class="dl"><h2>專案管理</h2>'+(S.projects.map(function(p){return '<div class="fr"><input type="text" class="fl" data-pn="'+p.id+'" value="'+esc(p.name)+'"><button class="x" data-px="'+p.id+'" title="刪除">✕</button></div>'}).join('')||'<div class="empty">還沒有專案。在考核表上方的「專案」選單選「＋ 新增專案…」也可以。</div>')+
    '<div class="fr"><input type="text" class="fl" id="pj_n" placeholder="新專案名稱"><button class="btn pri" id="pj_add">新增</button></div><div class="acts"><button class="btn" id="pj_x">完成</button></div></div>';
  }
  draw();
  dlg.onclick=function(e){
    if(e.target===dlg){dlg.close();return}
    var px=e.target.closest('[data-px]');
    if(px){if(!confirm('刪除這個專案？考核表欄位、STAR、事件上的專案標籤會清空，分數不受影響。'))return;var id=px.dataset.px;S.projects=S.projects.filter(function(x){return x.id!==id});Object.keys(S.sheets).forEach(function(y){S.sheets[y].cols.forEach(function(c){if(c.proj===id)c.proj=''})});S.stars.forEach(function(x){if(x.proj===id)x.proj=''});S.events.forEach(function(x){if(x.proj===id)x.proj=''});save();draw();return}
    if(e.target.id==='pj_add'){var n=dlg.querySelector('#pj_n').value.trim();if(n){S.projects.push({id:uid(),name:n,closed:false});save();draw()}return}
    if(e.target.id==='pj_x')dlg.close();
  };
  dlg.onchange=function(e){
    var t=e.target;
    if(t.dataset.pn){var p=S.projects.find(function(x){return x.id===t.dataset.pn});if(p&&t.value.trim()){p.name=t.value.trim();save()}}
    else if(t.dataset.pc){var p2=S.projects.find(function(x){return x.id===t.dataset.pc});if(p2){p2.closed=t.checked;save()}}
  };
  dlg.addEventListener('close',function h(){dlg.removeEventListener('close',h);dlg.onclick=function(e){if(e.target===dlg)dlg.close()};dlg.onchange=null;renderPpl()});
  dlg.showModal();
}

/* ---------- init ---------- */
window.__cal={get S(){return S},V:V,parseBatch:parseBatch,renderAll:renderAll,syncCats:function(){syncCats()},P:function(){return P}};
setSync(CF.url?'busy':'local');
applyPref();
(function(){
  try{
    var u=JSON.parse(localStorage.getItem(LSU)||'null');
    if(u){
      if(u.tab)P.tab=u.tab;if(u.pid)P.pid=u.pid;if(u.year)P.year=+u.year;if(u.period&&PER[u.period])P.period=u.period;
      if(u.n===1||u.n===3||u.n===7||u.n===8){V.n=u.n===7?8:u.n;V.start=V.n>=7?mondayOf(todayS()):todayS()}
    }
    renderAll();scrollToNow();
    if(u&&u.v==='ppl'){P.needJump=true;setView('ppl')}
  }catch(e){renderAll();scrollToNow()}
})();
pull();
setInterval(function(){if(!D&&!dlg.open&&!Q&&!document.querySelector('.editing')&&!document.body.classList.contains('vppl')){renderGrid();renderSide()}},60000);
})();
</script>
